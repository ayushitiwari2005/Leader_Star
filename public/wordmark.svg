  </defs>

  <style>
    .wordmark-text {
      font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.16em;
      fill: url(#wordmarkGold);
      font-size: 52px;
    }
  </style>

  <text x="10" y="58" class="wordmark-text" filter="url(#wmShadow)">BIZZNNOVATE</text>
